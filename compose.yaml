services:
  app:
    build:
      context: .
      dockerfile: Containerfile
    container_name: checkout_api
    ports:
      - "8000:8000"
    environment:
      - APP_NAME="Checkout API"
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_URL=http://localhost:8000
      - APP_KEY=base64:tQjF9mYQh1zW0p9V4lK9aB2cD3eF4gH5iJ6kL7mN8oP=
      - DB_CONNECTION=sqlite
      - CACHE_STORE=redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: checkout_redis
    ports:
      - "6379:6379"
    restart: unless-stopped
